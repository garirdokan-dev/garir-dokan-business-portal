    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        margin: 0;
        overflow-x: hidden;
      }

      /* A4 Preview Styles */
      .a4-page {
        width: 210mm;
        min-height: 297mm;
        margin: 10px auto;
        background: white;
        box-shadow: 0 0 50px rgba(0,0,0,0.5);
        box-sizing: border-box;
      }
      @media print {
        @page {
          size: A4 portrait;
          margin: 0mm;
        }
        
        /* Hide all UI elements, buttons, nav, sidebar, controls */
        nav, button, footer, .no-print, .print\:hidden {
          display: none !important;
        }

        /* Use simple, bulletproof visibility-based hiding for all other elements */
        body * {
          visibility: hidden !important;
        }

        /* Restore visibility only for the print modal and its decsendants */
        .print-modal-container, 
        .print-modal-container * {
          visibility: visible !important;
        }

        /* Anchor the print modal container perfectly to the top-left corner of the printed paper */
        .print-modal-container {
          display: block !important;
          position: fixed !important;
          left: 0 !important;
          top: 0 !important;
          width: 210mm !important;
          height: 297mm !important;
          max-height: 297mm !important;
          min-height: 297mm !important;
          margin: 0 !important;
          padding: 0 !important;
          box-shadow: none !important;
          border: none !important;
          background: #ffffff !important;
          background-color: #ffffff !important;
          backdrop-filter: none !important;
          z-index: 9999999 !important;
          overflow: visible !important;
        }

        /* Completely reset scrolling, scales, paddings, margins, shadows for print ancestors */
        .print-scroll-container,
        .print-scale-reset,
        .print-doc-preview-wrapper {
          display: block !important;
          position: relative !important;
          width: 210mm !important;
          height: 297mm !important;
          min-height: 297mm !important;
          max-height: 297mm !important;
          padding: 0 !important;
          margin: 0 !important;
          background: #ffffff !important;
          background-color: #ffffff !important;
          transform: none !important;
          scale: none !important;
          box-shadow: none !important;
          border: none !important;
          overflow: visible !important;
        }

        /* Style the actual A4 sheet to print perfectly on 1 standard page */
        .a4-page {
          display: block !important;
          position: relative !important;
          box-sizing: border-box !important;
          width: 210mm !important;
          height: 297mm !important;
          min-height: 297mm !important;
          max-height: 297mm !important;
          margin: 0 !important;
          padding: 0 !important;
          border: none !important;
          box-shadow: none !important;
          transform: none !important;
          background: #ffffff !important;
          background-color: #ffffff !important;
          page-break-inside: avoid !important;
          page-break-after: avoid !important;
          page-break-before: avoid !important;
          overflow: hidden !important;
        }

        html, body {
          background-color: #ffffff !important;
          background: #ffffff !important;
          margin: 0 !important;
          padding: 0 !important;
          width: 210mm !important;
          height: 297mm !important;
          overflow: visible !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
      }
      
      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #ef4444; /* red-500 */
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #b91c1c; /* red-700 */
      }

      /* Transitions */
      .animate-in {
        animation: fadeIn 0.5s ease-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .zoom-in {
        animation: zoomIn 0.3s ease-out;
      }
      @keyframes zoomIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }

      /* Safely override specific tailwind utility classes for light mode */
      html.light-mode body {
        background-color: #f3f4f6 !important;
        color: #111827 !important;
      }

      html.light-mode .text-white,
      html.light-mode .text-gray-200 { color: #111827 !important; }
      
      /* Exempt buttons and specific elements that should stay white text */
      html.light-mode .text-white-always,
      html.light-mode .group:hover .group-hover-text-white-always {
        color: #ffffff !important;
      }
      html.light-mode .group:hover .group-hover-text-red-100-always {
        color: #fecaca !important;
      }
      html.light-mode .bg-red-700.text-white,
      html.light-mode .bg-red-600.text-white,
      html.light-mode .bg-green-600.text-white,
      html.light-mode .bg-blue-500.text-white,
      html.light-mode .bg-blue-600.text-white,
      html.light-mode .bg-black.text-white,
      html.light-mode .hover\:bg-red-700:hover,
      html.light-mode .hover\:bg-red-600:hover,
      html.light-mode .hover\:bg-blue-500:hover {
        color: #ffffff !important;
      }

      /* Readable secondary text in light mode.
         These shades are light enough for the dark theme but nearly vanish on white; in light
         mode they take the matching dark shade. Anything inside .force-dark (the hero glass over
         the photo) keeps its dark-theme colour. */
      html.light-mode .text-gray-300:not(.force-dark *) { color: #374151 !important; }
      html.light-mode .text-gray-400:not(.force-dark *) { color: #4b5563 !important; }
      html.light-mode .text-red-500:not(.force-dark *)  { color: #b91c1c !important; }

      /* Force dark mode for specific elements */
      html.light-mode .force-dark,
      html.light-mode .force-dark h1,
      html.light-mode .force-dark h2,
      html.light-mode .force-dark h3,
      html.light-mode .force-dark p {
        color: #ffffff !important;
      }
      
      html.light-mode .force-dark .text-white,
      html.light-mode .force-dark.text-white { color: #ffffff !important; }

      html.light-mode .force-dark .text-gray-400,
      html.light-mode .force-dark.text-gray-400 { color: #9ca3af !important; }

      html.light-mode .force-dark .bg-white\/5,
      html.light-mode .force-dark.bg-white\/5 { background-color: rgba(255, 255, 255, 0.05) !important; }

      html.light-mode .force-dark .bg-white\/10,
      html.light-mode .force-dark.bg-white\/10 { background-color: rgba(255, 255, 255, 0.1) !important; }

      html.light-mode .force-dark .border-white\/10,
      html.light-mode .force-dark.border-white\/10 { border-color: rgba(255, 255, 255, 0.1) !important; }
      
      html.light-mode .force-dark .hover\:bg-white\/20:hover,
      html.light-mode .force-dark.hover\:bg-white\/20:hover { background-color: rgba(255, 255, 255, 0.2) !important; }

      /* Adjust specific background utility classes used in the app */
      html.light-mode .bg-\[\#0a0a0b\] { background-color: #f3f4f6 !important; }

      html.light-mode .bg-white\/5 { background-color: rgba(0, 0, 0, 0.03) !important; }
      html.light-mode .bg-white\/10 { background-color: rgba(0, 0, 0, 0.06) !important; }
      html.light-mode .bg-white\/20 { background-color: rgba(0, 0, 0, 0.12) !important; }
      html.light-mode .bg-white\/30 { background-color: rgba(0, 0, 0, 0.2) !important; }
      html.light-mode .bg-white\/50 { background-color: rgba(0, 0, 0, 0.3) !important; }

      html.light-mode .border-white\/5 { border-color: rgba(0, 0, 0, 0.05) !important; }
      html.light-mode .border-white\/10 { border-color: rgba(0, 0, 0, 0.1) !important; }
      html.light-mode .border-white\/20 { border-color: rgba(0, 0, 0, 0.2) !important; }

      html.light-mode .bg-black\/5 { background-color: rgba(255, 255, 255, 0.4) !important; }
      html.light-mode .bg-black\/10 { background-color: rgba(255, 255, 255, 0.5) !important; }
      html.light-mode .bg-black\/20 { background-color: rgba(255, 255, 255, 0.7) !important; }
      html.light-mode .bg-black\/30 { background-color: rgba(255, 255, 255, 0.8) !important; }
      html.light-mode .bg-black\/40 { background-color: rgba(255, 255, 255, 0.85) !important; }
      html.light-mode .bg-black\/50 { background-color: rgba(255, 255, 255, 0.9) !important; }
      html.light-mode .bg-black\/60 { background-color: rgba(255, 255, 255, 0.95) !important; }
      html.light-mode .bg-black\/80 { background-color: rgba(255, 255, 255, 0.98) !important; }
      html.light-mode .bg-black\/90,
      html.light-mode .bg-black\/95,
      html.light-mode .bg-black\/98 { background-color: rgba(255, 255, 255, 1) !important; }

      html.light-mode .text-white\/5 { color: rgba(0, 0, 0, 0.1) !important; }
      html.light-mode .text-white\/10 { color: rgba(0, 0, 0, 0.2) !important; }
      html.light-mode .text-white\/20 { color: rgba(0, 0, 0, 0.3) !important; }
      html.light-mode .text-white\/30 { color: rgba(0, 0, 0, 0.4) !important; }
      html.light-mode .text-white\/60 { color: rgba(0, 0, 0, 0.6) !important; }
      html.light-mode .text-white\/40 { color: rgba(0, 0, 0, 0.5) !important; }
      html.light-mode .text-white\/50 { color: rgba(0, 0, 0, 0.6) !important; }
      html.light-mode .text-white\/80 { color: rgba(0, 0, 0, 0.8) !important; }

      /* Placeholder overrides for light mode */
      html.light-mode .placeholder\:text-white\/20::placeholder { color: rgba(0, 0, 0, 0.4) !important; }
      html.light-mode .placeholder\:text-red-300::placeholder { color: rgba(220, 38, 38, 0.6) !important; } /* red-600 */

      html.light-mode .text-gray-400 { color: #4b5563 !important; }
      html.light-mode .text-gray-500 { color: #6b7280 !important; }
      html.light-mode .hover\:text-white:hover { color: #111827 !important; }
    </style>
